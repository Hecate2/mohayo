# 默认 profile = debug：测试/开发循环用
# 硬约束：合约依赖 via_ir 的无限栈槽（legacy 与精简优化步骤都会 stack-too-deep，见 docs/testing-design.md §构建提速），
#         故 via_ir + 完整 Yul 优化器不可关闭；optimizer_runs=1 产出最小体积字节码，保证全部合约低于 EIP-170 24KB 上限。
# 提速手段：增量编译（只重编改动文件）+ forge test --match-path 定向测试（只编匹配文件及其依赖）。
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 128 }

# release：发布/部署用，更高 optimizer_runs 换运行时 gas 效率（体积略增，仍低于 24KB）
# 用法：FOUNDRY_PROFILE=release forge build && FOUNDRY_OUT=out-release npx hardhat run scripts/deploy.ts --network <NET>
[profile.release]
out = "out-release"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 128, depth = 256 }

[fmt]
line_length = 100
tab_width = 4
